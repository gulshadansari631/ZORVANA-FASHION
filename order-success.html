<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed | ZORVANA FASHION</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:white;max-width:420px;width:100%;padding:30px 22px;border-radius:16px;text-align:center;box-shadow:0 4px 18px #0001}
.check{width:76px;height:76px;border-radius:50%;background:#e7f7ed;color:#218838;display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 18px}
h1{font-size:25px;margin:10px 0;color:#172337}
p{line-height:1.6;color:#555}
.cod{background:#fff5ed;border-radius:8px;padding:12px;margin:18px 0;color:#b94b12;font-weight:bold}
a{display:block;background:#fb641b;color:white;text-decoration:none;padding:14px;border-radius:7px;font-weight:bold;margin-top:18px}
.small{font-size:13px}
</style>
</head>
<body>
<div class="card">
<div class="check">✓</div>
<h1>Order Placed Successfully!</h1>
<p>Thank you for shopping with <b>ZORVANA FASHION</b>.</p>
<div class="cod">Payment Method: Cash on Delivery</div>
<p>We have received your order. Our team will contact you to confirm the delivery details.</p>
<p class="small">Please keep your phone available.</p>
<a href="/">CONTINUE SHOPPING</a>
</div>

</html>
