
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZORVANA FASHION | Delivery Partner</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f5f7;
 color:#222;
}
header{
 background:#171717;
 color:white;
 padding:20px;
 text-align:center;
}
.logo{
 font-size:24px;
 font-weight:bold;
 letter-spacing:2px;
}
header p{color:#bbb;margin:7px 0 0}
.container{
 max-width:440px;
 margin:35px auto;
 padding:15px;
}
.card{
 background:white;
 padding:25px;
 border-radius:14px;
 box-shadow:0 4px 20px #00000012;
}
h2{text-align:center;margin-top:0}
.subtitle{
 text-align:center;
 color:#777;
 font-size:14px;
 margin-bottom:25px;
}
.tabs{
 display:flex;
 gap:10px;
 margin-bottom:20px;
}
.tabs button{
 flex:1;
 background:#eee;
 color:#333;
}
.tabs button.active{
 background:#171717;
 color:white;
}
input,select{
 width:100%;
 padding:14px;
 margin:8px 0;
 border:1px solid #ddd;
 border-radius:8px;
 font-size:15px;
}
button{
 border:0;
 padding:13px;
 border-radius:8px;
 background:#171717;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
.submit{
 width:100%;
 margin-top:15px;
 background:#d99a27;
 color:#171717;
}
button:disabled{opacity:.6}
.form-title{
 font-size:17px;
 margin:15px 0;
}
.hidden{display:none!important}
#message{
 text-align:center;
 font-size:14px;
 margin-top:15px;
 color:#c62828;
}
.status{
 text-align:center;
 padding:25px 10px;
}
.status-icon{font-size:45px}
.status h2{margin:12px 0}
.status p{color:#666;line-height:1.6}
.status button{margin-top:15px}
footer{
 text-align:center;
 color:#888;
 font-size:12px;
 padding:20px;
}
</style>
</head>

<body>

<header>
 <div class="logo">ZORVANA FASHION</div>
 <p>Delivery Partner Portal</p>
</header>

<div class="container">

<div class="card" id="authCard">

 <h2>Delivery Partner</h2>
 <p class="subtitle">Join our delivery team</p>

 <div class="tabs">
  <button id="loginTab" class="active">LOGIN</button>
  <button id="registerTab">REGISTER</button>
 </div>

 <form id="loginForm">
  <div class="form-title">Welcome Back!</div>
  <input type="email" id="loginEmail"
   placeholder="Email Address" required>

  <input type="password" id="loginPassword"
   placeholder="Password" required>

  <button class="submit" type="submit">LOGIN</button>
 </form>

 <form id="registerForm" class="hidden">

  <div class="form-title">Create Your Account</div>

  <input id="name" placeholder="Full Name" required>

  <input type="email" id="email"
   placeholder="Email Address" required>

  <input type="password" id="password"
   placeholder="Create Password (Minimum 6 characters)"
   minlength="6" required>

  <input type="tel" id="phone"
   placeholder="10 Digit Mobile Number"
   maxlength="10" pattern="[0-9]{10}" required>

  <select id="vehicle" required>
   <option value="">Select Vehicle Type</option>
   <option value="Bike">Bike</option>
   <option value="Scooter">Scooter</option>
   <option value="Cycle">Cycle</option>
   <option value="Other">Other</option>
  </select>

  <input id="vehicleNumber"
   placeholder="Vehicle Number (e.g. BR38AB1234)"
   required>

  <button class="submit" type="submit">
   CREATE ACCOUNT & APPLY
  </button>

 </form>

 <div id="message"></div>

</div>

<div class="card hidden" id="statusCard">
 <div class="status">
  <div class="status-icon" id="statusIcon">⏳</div>
  <h2 id="statusTitle">Application Status</h2>
  <p id="statusText"></p>
  <button id="logoutButton">LOGOUT</button>
 </div>
</div>

</div>

<footer>
 © 2026 ZORVANA FASHION. All Rights Reserved.
</footer>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyC6ljZWr8cDxEtPuziF7DhxQYiykFRocOc",
 authDomain: "zorvana-fashion-new.firebaseapp.com",
 projectId: "zorvana-fashion-new",
 storageBucket: "zorvana-fashion-new.firebasestorage.app",
 messagingSenderId: "328407308597",
 appId: "1:328407308597:web:3a36dbb2e6c80e971ad47c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

function message(text){
 $("message").textContent = text;
}

function loading(form,value){
 form.querySelector("button[type=submit]").disabled = value;
}

async function profileRequest(method="GET",data=null){
 const user=auth.currentUser;
 if(!user) throw new Error("Please login first");

 const token=await user.getIdToken();

 const response=await fetch("/api/delivery/profile",{
  method,
  headers:{
   "Content-Type":"application/json",
   "Authorization":"Bearer "+token
  },
  ...(data?{body:JSON.stringify(data)}:{})
 });

 const result=await response.json();

 if(!response.ok){
  throw new Error(result.error || "Request failed");
 }

 return result;
}

function showStatus(profile){

 $("authCard").classList.add("hidden");
 $("statusCard").classList.remove("hidden");

 const status=profile.status;

 if(status==="pending"){
  $("statusIcon").textContent="⏳";
  $("statusTitle").textContent="Application Under Review";
  $("statusText").textContent=
   "Hello "+profile.name+
   "! Your registration is submitted. Please wait for Admin approval.";
 }

 else if(status==="approved"){
  $("statusIcon").textContent="✅";
  $("statusTitle").textContent="Account Approved!";
  $("statusText").textContent=
   "Congratulations "+profile.name+
   "! Your delivery partner account is approved. Your delivery dashboard will be available soon.";
 }

 else if(status==="rejected"){
  $("statusIcon").textContent="❌";
  $("statusTitle").textContent="Application Rejected";
  $("statusText").textContent=
   "Your application was not approved. Please contact ZORVANA FASHION Admin.";
 }

 else if(status==="suspended"){
  $("statusIcon").textContent="⚠️";
  $("statusTitle").textContent="Account Suspended";
  $("statusText").textContent=
   "Your delivery account is currently suspended. Contact Admin.";
 }
}

function showApplication(){
 $("statusCard").classList.add("hidden");
 $("authCard").classList.remove("hidden");
 $("loginForm").classList.add("hidden");
 $("registerForm").classList.remove("hidden");
 $("loginTab").classList.remove("active");
 $("registerTab").classList.add("active");
 $("registerForm").querySelector(".form-title").textContent=
  "Complete Your Delivery Application";
}

async function checkProfile(user){
 try{
  const result=await profileRequest("GET");

  if(result.profile){
   showStatus(result.profile);
  }else{
   showApplication();
   message("Account created. Complete your delivery application.");
  }

 }catch(error){
  message(error.message);
  $("authCard").classList.remove("hidden");
 }
}

$("loginTab").onclick=()=>{
 $("loginForm").classList.remove("hidden");
 $("registerForm").classList.add("hidden");
 $("loginTab").classList.add("active");
 $("registerTab").classList.remove("active");
 message("");
};

$("registerTab").onclick=()=>{
 $("registerForm").classList.remove("hidden");
 $("loginForm").classList.add("hidden");
 $("registerTab").classList.add("active");
 $("loginTab").classList.remove("active");
 message("");
};

$("loginForm").onsubmit=async e=>{
 e.preventDefault();
 const form=e.currentTarget;
 loading(form,true);
 message("");

 try{
  await signInWithEmailAndPassword(
   auth,
   $("loginEmail").value.trim(),
   $("loginPassword").value
  );
 }catch(error){
  message(error.message);
 }finally{
  loading(form,false);
 }
};

$("registerForm").onsubmit=async e=>{
 e.preventDefault();

 const form=e.currentTarget;
 loading(form,true);
 message("");

 try{

  const name=$("name").value.trim();
  const phone=$("phone").value.trim();
  const vehicle=$("vehicle").value;
  const number=$("vehicleNumber").value.trim();

  if(!/^[0-9]{10}$/.test(phone)){
   throw new Error("Enter valid 10 digit mobile number");
  }

  const credential=await createUserWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );

  await profileRequest("POST",{
   name,
   phone,
   vehicle_type:vehicle,
   vehicle_number:number
  });

  await checkProfile(credential.user);

 }catch(error){
  message(error.message);
 }finally{
  loading(form,false);
 }
};

$("logoutButton").onclick=async()=>{
 await signOut(auth);
 $("statusCard").classList.add("hidden");
 $("authCard").classList.remove("hidden");
 $("loginForm").classList.remove("hidden");
 $("registerForm").classList.add("hidden");
 message("");
};

onAuthStateChanged(auth,async user=>{
 if(user){
  await checkProfile(user);
 }else{
  $("authCard").classList.remove("hidden");
  $("statusCard").classList.add("hidden");
 }
});

</script>

</body>
</html>
