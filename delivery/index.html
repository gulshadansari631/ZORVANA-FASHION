
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZORVANA FASHION | Delivery Partner</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
header{background:#171717;color:white;padding:20px;text-align:center}
.logo{font-size:23px;font-weight:bold;letter-spacing:2px}
header p{color:#bbb;margin:7px 0 0}
.container{max-width:600px;margin:25px auto;padding:12px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 4px 20px #00000012;margin-bottom:16px}
h2{text-align:center;margin:0 0 8px}
.subtitle{text-align:center;color:#777;font-size:14px;margin:0 0 22px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tabs button{flex:1;background:#eee;color:#333}
.tabs button.active{background:#171717;color:white}
input,select{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{border:0;padding:13px;border-radius:8px;background:#171717;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.submit{width:100%;margin-top:15px;background:#d99a27;color:#171717}
.hidden{display:none!important}
#message{font-size:14px;margin-top:14px;text-align:center;color:#c62828;line-height:1.5}
.form-title{font-size:17px;margin:12px 0}
.status{text-align:center;padding:18px 8px}
.status-icon{font-size:42px}
.status p{color:#666;line-height:1.6}
.order{border:1px solid #e5e5e5;border-radius:12px;padding:16px;margin:14px 0}
.order h3{margin:0 0 10px;font-size:17px}
.order p{margin:7px 0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.order-actions a,.order-actions button{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:8px;font-size:13px;font-weight:bold}
.call{background:#e8f5e9;color:#176b2c}
.map{background:#e8f0fe;color:#174ea6}
.deliver{background:#171717;color:white}
.delivered{background:#d99a27;color:#171717}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.topline h2{text-align:left;margin:0}
.logout{background:#eee;color:#333;padding:10px 14px}
.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#f1f1f1;font-size:12px;font-weight:bold}
.empty{text-align:center;color:#777;padding:25px 8px;line-height:1.5}
footer{text-align:center;color:#888;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<div class="logo">ZORVANA FASHION</div>
<p>Delivery Partner Portal</p>
</header>

<div class="container">

<div class="card" id="authCard">
<h2>Delivery Partner</h2>
<p class="subtitle">Login to manage your deliveries</p>

<div class="tabs">
<button type="button" id="loginTab" class="active">LOGIN</button>
<button type="button" id="registerTab">REGISTER</button>
</div>

<form id="loginForm">
<div class="form-title">Welcome Back!</div>
<input type="tel" id="loginPhone" placeholder="10 Digit Mobile Number" maxlength="10" pattern="[0-9]{10}" required>
<input type="password" id="loginPassword" placeholder="Password" required>
<button class="submit" type="submit">LOGIN</button>
</form>

<form id="registerForm" class="hidden">
<div class="form-title">Create Your Account</div>
<input id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email Address" required>
<input type="password" id="password" placeholder="Create Password (Minimum 6 characters)" minlength="6" required>
<input type="tel" id="phone" placeholder="10 Digit Mobile Number" maxlength="10" pattern="[0-9]{10}" required>
<select id="vehicle" required>
<option value="">Select Vehicle Type</option>
<option value="Bike">Bike</option>
<option value="Scooter">Scooter</option>
<option value="Cycle">Cycle</option>
<option value="Other">Other</option>
</select>
<input id="vehicleNumber" placeholder="Vehicle Number (e.g. BR38AB1234)" required>
<button class="submit" type="submit">CREATE ACCOUNT & APPLY</button>
</form>

<div id="message"></div>
</div>

<div class="card hidden" id="statusCard">
<div class="status">
<div class="status-icon" id="statusIcon">⏳</div>
<h2 id="statusTitle">Application Status</h2>
<p id="statusText"></p>
<button id="statusLogout">LOGOUT</button>
</div>
</div>

<div class="hidden" id="dashboard">
<div class="card">
<div class="topline">
<h2 id="welcomeName">My Deliveries</h2>
<button class="logout" id="dashboardLogout">LOGOUT</button>
</div>
<p class="subtitle" style="text-align:left;margin:10px 0 0">Your assigned orders are shown below.</p>
</div>

<div class="card">
<div class="topline">
<strong>Assigned Orders</strong>
<button type="button" id="refreshOrders" class="logout">REFRESH</button>
</div>
<div id="ordersList">
<div class="empty">Loading your orders...</div>
</div>
</div>
</div>

</div>

<footer>© 2026 ZORVANA FASHION. All Rights Reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyC6ljZWr8cDxEtPuziF7DhxQYiykFRocOc",
authDomain:"zorvana-fashion-new.firebaseapp.com",
projectId:"zorvana-fashion-new",
storageBucket:"zorvana-fashion-new.firebasestorage.app",
messagingSenderId:"328407308597",
appId:"1:328407308597:web:3a36dbb2e6c80e971ad47c"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const $=id=>document.getElementById(id);

let deliveryToken=sessionStorage.getItem("zorvana_delivery_token")||"";
let deliveryName=sessionStorage.getItem("zorvana_delivery_name")||"Delivery Partner";

function message(text){
$("message").textContent=text;
}

function loading(form,value){
form.querySelector('button[type="submit"]').disabled=value;
}

function showLogin(){
$("dashboard").classList.add("hidden");
$("statusCard").classList.add("hidden");
$("authCard").classList.remove("hidden");
}

function showDashboard(name){
deliveryName=name||deliveryName;
$("welcomeName").textContent="Hello, "+deliveryName;
$("authCard").classList.add("hidden");
$("statusCard").classList.add("hidden");
$("dashboard").classList.remove("hidden");
loadOrders();
}

function showStatus(profile){
$("authCard").classList.add("hidden");
$("dashboard").classList.add("hidden");
$("statusCard").classList.remove("hidden");

const status=profile.status;

if(status==="pending"){
$("statusIcon").textContent="⏳";
$("statusTitle").textContent="Application Under Review";
$("statusText").textContent="Hello "+profile.name+"! Your registration is submitted. Please wait for Admin approval.";
}
else if(status==="approved"){
showDashboard(profile.name);
}
else if(status==="rejected"){
$("statusIcon").textContent="❌";
$("statusTitle").textContent="Application Rejected";
$("statusText").textContent="Your application was not approved. Please contact ZORVANA FASHION Admin.";
}
else if(status==="suspended"){
$("statusIcon").textContent="⚠️";
$("statusTitle").textContent="Account Suspended";
$("statusText").textContent="Your delivery account is currently suspended. Contact Admin.";
}
else{
$("statusIcon").textContent="ℹ️";
$("statusTitle").textContent="Account Status";
$("statusText").textContent="Please contact Admin for help.";
}
}

async function profileRequest(method="GET",data=null){
const user=auth.currentUser;
if(!user)throw new Error("Please login first");

const token=await user.getIdToken();

const response=await fetch("/api/delivery/profile",{
method,
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
...(data?{body:JSON.stringify(data)}:{})
});

const result=await response.json();
if(!response.ok)throw new Error(result.error||"Request failed");
return result;
}

async function loadOrders(){
$("ordersList").innerHTML='<div class="empty">Loading your orders...</div>';

try{
const response=await fetch("/api/delivery/orders",{
headers:{"Authorization":"Bearer "+deliveryToken}
});

const data=await response.json();
if(!response.ok)throw new Error(data.error||"Could not load orders");

const orders=Array.isArray(data)?data:(data.orders||[]);

if(!orders.length){
$("ordersList").innerHTML='<div class="empty">Abhi aapko koi order assign nahi hua hai.<br>New order assign hone par yahan dikhega.</div>';
return;
}

$("ordersList").innerHTML="";

orders.forEach(order=>{
const pick=(keys,fallback="Not available")=>{
for(const key of keys){
if(order[key]!==undefined&&order[key]!==null&&String(order[key]).trim()!==""){
return String(order[key]);
}
}
return fallback;
};

const id=pick(["id","order_id"],"");
const customer=pick(["customer_name","name","full_name","shipping_name","user_name"],"Customer");
const phone=pick(["customer_phone","phone","mobile","shipping_phone","contact_number"],"");
const addressParts=[
pick(["address","shipping_address","full_address"],""),
pick(["city","district"],""),
pick(["state"],""),
pick(["pincode","postal_code","zip"],"")
].filter(x=>x);

const address=addressParts.length?addressParts.join(", "):"Address not available";
const product=pick(["product_name","product","items","item_name"],"Order details");
const price=pick(["total_amount","total","amount","price","product_price"],"");
const status=pick(["status"],"Pending");

const box=document.createElement("div");
box.className="order";

const heading=document.createElement("h3");
heading.textContent="Order #"+id;
box.appendChild(heading);

const pill=document.createElement("span");
pill.className="pill";
pill.textContent=status;
box.appendChild(pill);

function addLine(label,value){
const p=document.createElement("p");
const strong=document.createElement("strong");
strong.textContent=label+": ";
p.append(strong,document.createTextNode(value));
box.appendChild(p);
}

addLine("Customer",customer);
addLine("Phone",phone||"Not available");
addLine("Address",address);
addLine("Product",product);
if(price)addLine("Amount",price);

const actions=document.createElement("div");
actions.className="order-actions";

if(phone){
const call=document.createElement("a");
call.className="call";
call.href="tel:"+phone;
call.textContent="CALL CUSTOMER";
actions.appendChild(call);
}

if(addressParts.length){
const map=document.createElement("a");
map.className="map";
map.target="_blank";
map.rel="noopener";
map.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(address);
map.textContent="OPEN MAP";
actions.appendChild(map);
}

if(status!=="Delivered"){
const button=document.createElement("button");
button.className=status==="Out for Delivery"?"delivered":"deliver";
button.textContent=status==="Out for Delivery"?"MARK DELIVERED":"OUT FOR DELIVERY";

button.onclick=()=>updateStatus(
id,
status==="Out for Delivery"?"Delivered":"Out for Delivery",
button
);

actions.appendChild(button);
}

box.appendChild(actions);
$("ordersList").appendChild(box);
});

}catch(error){
$("ordersList").innerHTML='<div class="empty"></div>';
$("ordersList").firstChild.textContent=error.message;
}
}

async function updateStatus(id,status,button){
if(!id){
alert("Order ID missing");
return;
}

button.disabled=true;

try{
const response=await fetch("/api/delivery/orders",{
method:"PATCH",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+deliveryToken
},
body:JSON.stringify({id:Number(id),status})
});

const result=await response.json();
if(!response.ok)throw new Error(result.error||"Status update failed");

await loadOrders();

}catch(error){
alert(error.message);
button.disabled=false;
}
}

function logout(){
deliveryToken="";
sessionStorage.removeItem("zorvana_delivery_token");
sessionStorage.removeItem("zorvana_delivery_name");
signOut(auth).catch(()=>{});
showLogin();
$("loginForm").reset();
message("");
}

$("loginTab").onclick=()=>{
$("loginForm").classList.remove("hidden");
$("registerForm").classList.add("hidden");
$("loginTab").classList.add("active");
$("registerTab").classList.remove("active");
message("");
};

$("registerTab").onclick=()=>{
$("registerForm").classList.remove("hidden");
$("loginForm").classList.add("hidden");
$("registerTab").classList.add("active");
$("loginTab").classList.remove("active");
message("");
};

$("loginForm").onsubmit=async e=>{
e.preventDefault();

const form=e.currentTarget;
loading(form,true);
message("");

try{
const phone=$("loginPhone").value.trim();

if(!/^[0-9]{10}$/.test(phone)){
throw new Error("Enter valid 10 digit mobile number");
}

const response=await fetch("/api/delivery/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
phone,
password:$("loginPassword").value
})
});

const result=await response.json();

if(!response.ok||!result.idToken){
throw new Error(result.error||"Login failed");
}

deliveryToken=result.idToken;
deliveryName=result.name||"Delivery Partner";

sessionStorage.setItem("zorvana_delivery_token",deliveryToken);
sessionStorage.setItem("zorvana_delivery_name",deliveryName);

showDashboard(deliveryName);

}catch(error){
message(error.message);
}
finally{
loading(form,false);
}
};

$("registerForm").onsubmit=async e=>{
e.preventDefault();

const form=e.currentTarget;
loading(form,true);
message("");

try{
const name=$("name").value.trim();
const phone=$("phone").value.trim();
const vehicle=$("vehicle").value;
const number=$("vehicleNumber").value.trim();

if(!/^[0-9]{10}$/.test(phone)){
throw new Error("Enter valid 10 digit mobile number");
}

const credential=await createUserWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

const token=await credential.user.getIdToken();

const response=await fetch("/api/delivery/profile",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:JSON.stringify({
name,
phone,
vehicle_type:vehicle,
vehicle_number:number
})
});

const result=await response.json();

if(!response.ok){
throw new Error(result.error||"Application submit failed");
}

showStatus(result.profile||{name,status:"pending"});

}catch(error){
message(error.message);
}
finally{
loading(form,false);
}
};

$("statusLogout").onclick=logout;
$("dashboardLogout").onclick=logout;
$("refreshOrders").onclick=loadOrders;

onAuthStateChanged(auth,async user=>{
if(user&&!deliveryToken){
try{
const result=await profileRequest("GET");
if(result.profile)showStatus(result.profile);
else showLogin();
}catch(error){
showLogin();
message(error.message);
}
}
else if(!user&&deliveryToken){
showDashboard(deliveryName);
}
else if(!user){
showLogin();
}
});

if(deliveryToken){
showDashboard(deliveryName);
}
</script>
</body>
</html>
