
name: Build ZORVANA Customer APK

on:
  workflow_dispatch:
  push:
    branches:
      - zorvana-customer-android
    paths:
      - 'android-customer/**'
      - '.github/workflows/build-customer-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
                with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build customer APK
        run: gradle -p android-customer :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zorvana-customer-debug-apk
          path: android-customer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
